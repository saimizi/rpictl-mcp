[package]
name = "rpictl-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.1.4", features = ["transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
serialport = { version = "4.8", default-features = false }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
